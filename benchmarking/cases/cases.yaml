# The 43 VulnBump repositories: each case pins a repository commit and gives the image and the
# install, build and test commands. This is the default --cases-dir (../cases from scripts/).
name: vulnbump
cases:
- name: reactivex-rxjava
  inputs:
    name: reactivex-rxjava
    repo_url: https://github.com/ReactiveX/RxJava
    commit_sha: bc140f69a0ffebebfff988a0b1ef65c11150d69f
    images:
      release: snyk/snyk:maven-3-jdk-17
      local: gradle:8-jdk17
    test_cmd: ./gradlew cleanTest test --continue --no-daemon
    install_cmd: ''
    timeout_s: 21600
    build_cmd: ./gradlew compileJava --no-daemon -q
    test_framework: gradle
  metadata:
    ecosystem: gradle
    source: curated
    display: ReactiveX/RxJava
