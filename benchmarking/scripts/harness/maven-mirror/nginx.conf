# Read-through cache of Maven Central. Every attempt resolves its whole
# dependency tree three times (baseline, agent, verify); fetched fresh, 4 repos
# at a time, that trips Central's per-IP rate limit (HTTP 429).
proxy_cache_path /cache levels=1:2 keys_zone=maven:50m max_size=100g inactive=60d use_temp_path=off;

server {
    listen 80;

    location /maven2/ {
        proxy_pass https://repo.maven.apache.org/maven2/;
        proxy_ssl_server_name on;
        proxy_set_header Host repo.maven.apache.org;
        # The cache key ignores Accept-Encoding, so one client asking for br would
        # cache a body that Maven can't decode. Always fetch and store identity.
        proxy_set_header Accept-Encoding "";
        proxy_cache maven;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        # harness/maven_mirror.py's preflight: go to Central, store nothing.
        proxy_cache_bypass $http_x_mirror_check;
        proxy_no_cache $http_x_mirror_check;
    }
}
